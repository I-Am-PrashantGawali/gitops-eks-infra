AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM roles for EKS - cluster role, node group role, and
  IRSA roles for ALB controller, Cluster Autoscaler, and EBS CSI driver.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
  # Filled in after the EKS cluster is created (stack update or separate deployment)
  OIDCProviderArn:
    Type: String
    Default: ''
    Description: ARN of the OIDC provider created by EKS (fill after cluster creation)
  OIDCProviderUrl:
    Type: String
    Default: ''
    Description: URL of the OIDC provider without https:// prefix

Conditions:
  HasOIDC: !Not [!Equals [!Ref OIDCProviderArn, '']]

Resources:
  # ── EKS Cluster Role ───────────────────────────────────────────────────────
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-eks-cluster-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── EKS Node Group Role ────────────────────────────────────────────────────
  EKSNodeGroupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-eks-nodegroup-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # SSM Session Manager access
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── ALB Controller IRSA Role ───────────────────────────────────────────────
  ALBControllerRole:
    Type: AWS::IAM::Role
    Condition: HasOIDC
    Properties:
      RoleName: !Sub ${EnvironmentName}-alb-controller-role
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": "${OIDCProviderArn}"
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "${OIDCProviderUrl}:sub": "system:serviceaccount:kube-system:aws-load-balancer-controller",
                  "${OIDCProviderUrl}:aud": "sts.amazonaws.com"
                }
              }
            }
          ]
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasOIDC
    Properties:
      ManagedPolicyName: !Sub ${EnvironmentName}-alb-controller-policy
      Roles:
        - !Ref ALBControllerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName: elasticloadbalancing.amazonaws.com
          - Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeVpcs
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeTags
              - ec2:GetCoipPoolUsage
              - ec2:DescribeCoipPools
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeListenerCertificates
              - elasticloadbalancing:DescribeSSLPolicies
              - elasticloadbalancing:DescribeRules
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetHealth
              - elasticloadbalancing:DescribeTags
            Resource: '*'
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - acm:ListCertificates
              - acm:DescribeCertificate
              - iam:ListServerCertificates
              - iam:GetServerCertificate
              - waf-regional:GetWebACL
              - waf-regional:GetWebACLForResource
              - waf-regional:AssociateWebACL
              - waf-regional:DisassociateWebACL
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
              - wafv2:AssociateWebACL
              - wafv2:DisassociateWebACL
              - shield:GetSubscriptionState
              - shield:DescribeProtection
              - shield:CreateProtection
              - shield:DeleteProtection
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateSecurityGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:CreateAction: CreateSecurityGroup
              'Null':
                aws:RequestedRegion: 'false'
          - Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: arn:aws:ec2:*:*:security-group/*
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:DeleteSecurityGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:DeleteTargetGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
            Resource: arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:SetWebAcl
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:AddListenerCertificates
              - elasticloadbalancing:RemoveListenerCertificates
              - elasticloadbalancing:ModifyRule
            Resource: '*'

  # ── Cluster Autoscaler IRSA Role ───────────────────────────────────────────
  ClusterAutoscalerRole:
    Type: AWS::IAM::Role
    Condition: HasOIDC
    Properties:
      RoleName: !Sub ${EnvironmentName}-cluster-autoscaler-role
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": "${OIDCProviderArn}"
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "${OIDCProviderUrl}:sub": "system:serviceaccount:kube-system:cluster-autoscaler",
                  "${OIDCProviderUrl}:aud": "sts.amazonaws.com"
                }
              }
            }
          ]
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ClusterAutoscalerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasOIDC
    Properties:
      ManagedPolicyName: !Sub ${EnvironmentName}-cluster-autoscaler-policy
      Roles:
        - !Ref ClusterAutoscalerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeAutoScalingInstances
              - autoscaling:DescribeLaunchConfigurations
              - autoscaling:DescribeScalingActivities
              - autoscaling:DescribeTags
              - ec2:DescribeImages
              - ec2:DescribeInstanceTypes
              - ec2:DescribeLaunchTemplateVersions
              - ec2:GetInstanceTypesFromInstanceRequirements
              - eks:DescribeNodegroup
            Resource: '*'
          - Effect: Allow
            Action:
              - autoscaling:SetDesiredCapacity
              - autoscaling:TerminateInstanceInAutoScalingGroup
            Resource: '*'

  # ── EBS CSI Driver IRSA Role ──────────────────────────────────────────────
  EBSCSIDriverRole:
    Type: AWS::IAM::Role
    Condition: HasOIDC
    Properties:
      RoleName: !Sub ${EnvironmentName}-ebs-csi-driver-role
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": "${OIDCProviderArn}"
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "${OIDCProviderUrl}:sub": "system:serviceaccount:kube-system:ebs-csi-controller-sa",
                  "${OIDCProviderUrl}:aud": "sts.amazonaws.com"
                }
              }
            }
          ]
        }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  EKSClusterRoleArn:
    Value: !GetAtt EKSClusterRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-EKSClusterRoleArn

  EKSNodeGroupRoleArn:
    Value: !GetAtt EKSNodeGroupRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-EKSNodeGroupRoleArn

  ALBControllerRoleArn:
    Condition: HasOIDC
    Value: !GetAtt ALBControllerRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-ALBControllerRoleArn

  ClusterAutoscalerRoleArn:
    Condition: HasOIDC
    Value: !GetAtt ClusterAutoscalerRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-ClusterAutoscalerRoleArn

  EBSCSIDriverRoleArn:
    Condition: HasOIDC
    Value: !GetAtt EBSCSIDriverRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-EBSCSIDriverRoleArn
