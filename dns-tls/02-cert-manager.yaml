# cert-manager + ClusterIssuer for Let's Encrypt
# Apply with: kubectl apply -f 02-cert-manager.yaml
#
# Prerequisites:
#   helm repo add jetstack https://charts.jetstack.io
#   helm repo update
#
# Install cert-manager first (see deploy-dns-tls.sh),
# then apply this file for the ClusterIssuer.
---
# cert-manager ServiceAccount — annotated with the IRSA role ARN
# so it can call Route53 for DNS-01 challenges without static keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager
  namespace: cert-manager
  annotations:
    # Filled in by deploy-dns-tls.sh via sed
    eks.amazonaws.com/role-arn: REPLACE_CERT_MANAGER_ROLE_ARN
---
# ClusterIssuer: Let's Encrypt PRODUCTION
# Use this once you've verified staging works.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_YOUR_EMAIL            # Let's Encrypt sends cert expiry warnings here
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: REPLACE_REGION
            hostedZoneID: REPLACE_HOSTED_ZONE_ID
---
# ClusterIssuer: Let's Encrypt STAGING
# Use this first to test — staging has no rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_YOUR_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          route53:
            region: REPLACE_REGION
            hostedZoneID: REPLACE_HOSTED_ZONE_ID
