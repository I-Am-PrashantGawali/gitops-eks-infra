# External DNS
# Watches Ingress/Service objects and automatically creates/deletes
# Route53 A/CNAME records to match.
#
# Applied by deploy-dns-tls.sh after substituting placeholders.
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_EXTERNAL_DNS_ROLE_ARN
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: ['']
    resources: [services, endpoints, pods, nodes]
    verbs: [get, watch, list]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.14.2
          args:
            - --source=ingress
            - --source=service
            - --domain-filter=REPLACE_DOMAIN_NAME   # only manage records for your domain
            - --provider=aws
            - --aws-zone-type=public
            - --registry=txt
            - --txt-owner-id=REPLACE_HOSTED_ZONE_ID
            - --log-level=info
            - --policy=sync          # sync = delete stale records; use upsert-only to be safe at first
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 100Mi
          env:
            - name: AWS_DEFAULT_REGION
              value: REPLACE_REGION
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
