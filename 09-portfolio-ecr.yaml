AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECR repository for portfolio website with lifecycle policies and image scanning.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod

Resources:
  # ── Portfolio Website ECR Repository ───────────────────────────────────────
  PortfolioRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: portfolio-website
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Remove untagged images older than 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: portfolio-website

Outputs:
  PortfolioRepositoryUri:
    Value: !GetAtt PortfolioRepository.RepositoryUri
    Export:
      Name: !Sub ${EnvironmentName}-portfolio-website-RepoUri

  PortfolioRepositoryArn:
    Value: !GetAtt PortfolioRepository.Arn
    Export:
      Name: !Sub ${EnvironmentName}-portfolio-website-RepoArn
