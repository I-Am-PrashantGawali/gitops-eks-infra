AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IRSA role for External Secrets Operator to read from AWS Secrets Manager.
  Also creates ECR repositories for backend and frontend images.

Parameters:
  EnvironmentName:
    Type: String
    Default: workshop

  ClusterOIDCIssuer:
    Type: String
    Description: >
      OIDC issuer URL of the EKS cluster WITHOUT the https:// prefix.
      e.g. oidc.eks.us-east-1.amazonaws.com/id/EXAMPLED539D4633E53DE1B71EXAMPLE

  ESONamespace:
    Type: String
    Default: external-secrets
    Description: Kubernetes namespace where the ESO service account lives.

  ESOServiceAccountName:
    Type: String
    Default: external-secrets
    Description: Name of the ESO Kubernetes service account.

Resources:

  # ── ECR – Backend ───────────────────────────────────────────────────────────
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: backend
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 20 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Remove untagged images older than 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: backend

  # ── ECR – Frontend ──────────────────────────────────────────────────────────
  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: frontend
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 20 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Remove untagged images older than 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: frontend

  # ── IAM – IRSA role for External Secrets Operator ──────────────────────────
  ESOIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-external-secrets-irsa
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/${ClusterOIDCIssuer}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Allow only the ESO service account to assume this role
                !Sub "${ClusterOIDCIssuer}:sub": !Sub "system:serviceaccount:${ESONamespace}:${ESOServiceAccountName}"
                !Sub "${ClusterOIDCIssuer}:aud": "sts.amazonaws.com"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ESOSecretsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${EnvironmentName}-eso-secrets-read
      Roles:
        - !Ref ESOIAMRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadWorkshopSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:ListSecretVersionIds
            Resource:
              # Allow access to all secrets under the gitops/workshop/* path
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gitops/workshop/*

  # ── IAM – GitHub Actions CI user (ECR push only) ───────────────────────────
  # In production, prefer OIDC federation (aws-actions/configure-aws-credentials
  # with role-to-assume) over static IAM user keys.
  GitHubActionsECRPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${EnvironmentName}-github-actions-ecr-push
      Description: Allows GitHub Actions to push images to ECR
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ECRAuth
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: ECRPush
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:DescribeRepositories
              - ecr:ListImages
            Resource:
              - !GetAtt BackendRepository.Arn
              - !GetAtt FrontendRepository.Arn

Outputs:
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
    Export:
      Name: !Sub ${EnvironmentName}-backend-repo-uri

  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
    Export:
      Name: !Sub ${EnvironmentName}-frontend-repo-uri

  ESOIAMRoleArn:
    Value: !GetAtt ESOIAMRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-eso-irsa-role-arn
    Description: >
      Paste this ARN into argocd/apps/infra/external-secrets-app.yaml
      under serviceAccount.annotations.eks.amazonaws.com/role-arn

  GitHubActionsECRPolicyArn:
    Value: !Ref GitHubActionsECRPolicy
    Description: >
      Attach this policy to the IAM user/role used by GitHub Actions.
